# Plantilla. Copia a .streamlit/secrets.toml (local, esta en .gitignore) o pega el contenido en
# "Secrets" de Streamlit Cloud. NUNCA subas el archivo real: el repo es publico.

BUSCACHAMBAS_STORAGE = "gs://<bucket>"
BUSCACHAMBAS_JOB = "projects/<proyecto>/locations/<region>/jobs/<job>"
BUSCACHAMBAS_MAX_SIMULTANEOS = 2

[auth]
# local: http://localhost:8501/oauth2callback  |  Streamlit Cloud: https://<tu-app>.streamlit.app/oauth2callback
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "<cadena aleatoria larga>"
client_id = "<ID de cliente OAuth>"
client_secret = "<secreto del cliente OAuth>"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Solo en Streamlit Cloud (en tu PC se usa GOOGLE_APPLICATION_CREDENTIALS). Descomenta y rellena;
# una seccion vacia no se acepta.
# [gcp_service_account]
# type = "service_account"
# ... (un campo por linea del JSON de la cuenta de servicio de la GUI)
